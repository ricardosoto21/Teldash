<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teldash - Gestión de Rutas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: #1c1e21; }
        .header-bg { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 40px 0 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Tarjetas */
        .country-card { transition: transform 0.2s, box-shadow 0.2s; border: none; border-radius: 12px; overflow: hidden; }
        .country-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
        .card-title { font-weight: 800; font-size: 1.2rem; color: #333; }
        .search-box { border-radius: 20px; padding: 10px 20px; border: 1px solid #ddd; }

        /* Botones de acción en tarjeta */
        .btn-action { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 8px; border-radius: 8px; transition: 0.2s; }
        .btn-prov { color: #4b5563; border: 1px solid #d1d5db; background: #f9fafb; }
        .btn-prov:hover { background: #f3f4f6; color: #111827; }
        .btn-sale { color: #3730a3; border: 1px solid #c7d2fe; background: #eef2ff; }
        .btn-sale:hover { background: #e0e7ff; color: #312e81; }
        .btn-live { color: #991b1b; border: 1px solid #fecaca; background: #fef2f2; }

        /* Modales */
        .modal-header-prov { background-color: #f3f4f6; border-bottom: 2px solid #e5e7eb; }
        .modal-header-sale { background-color: #eef2ff; border-bottom: 2px solid #c7d2fe; color: #312e81; }
        .table-details th { font-size: 0.75rem; text-transform: uppercase; color: #6b7280; background: #f9fafb; }
        
        /* Live Modal */
        .live-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .live-modal-content { background: #1e293b; margin: 3% auto; padding: 25px; width: 95%; max-width: 1200px; border-radius: 15px; position: relative; color: #f8fafc; }
        .close-live { position: absolute; top: 15px; right: 20px; color: #ef4444; font-size: 30px; cursor: pointer; }
        .live-table-container { margin-top: 20px; max-height: 500px; overflow-y: auto; }
        .live-table-container table { width: 100%; color: #f8fafc; font-size: 13px; }
    </style>
</head>
<body>

<div class="header-bg text-center">
    <div class="container">
        <h1 class="fw-bold">🌍 Teldash: Panel de Gestión</h1>
        <p class="lead opacity-75">Control de Costos de Proveedores y Precios de Venta</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row mb-4 justify-content-center">
        <div class="col-md-5 mb-2">
            <input type="text" id="searchCountry" class="form-control search-box" placeholder="🔍 Buscar País (Ej. Chile)...">
        </div>
        <div class="col-md-4 mb-2">
            <select id="filterProvider" class="form-select search-box">
                <option value="ALL">🏢 Todos los Proveedores</option>
            </select>
        </div>
    </div>

    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-muted fw-bold">Cargando base de datos dual...</p>
    </div>

    <div class="row" id="cardsContainer"></div>
</div>

<div class="modal fade" id="provModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header modal-header-prov d-flex justify-content-between align-items-center">
                <h4 class="modal-title fw-bold mb-0" id="modalProvName">Costos Proveedores</h4>
                <div>
                    <button id="toggleOpBtn" class="btn btn-sm btn-outline-secondary me-3" onclick="toggleOperadores()">Ver Detalle Operadores</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-details mb-0">
                        <thead id="modalProvHead"></thead>
                        <tbody id="modalProvBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header modal-header-sale">
                <h4 class="modal-title fw-bold" id="modalSaleName">Rutas de Venta</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Cliente / Ruta</th>
                                <th>Operador</th>
                                <th class="text-center">Precio Venta (USD)</th>
                            </tr>
                        </thead>
                        <tbody id="modalSaleBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="liveModal" class="live-modal">
    <div class="live-modal-content">
        <span class="close-live" onclick="closeLive()">&times;</span>
        <h2 id="live-title" style="color: #818cf8; font-weight: 800;">📡 Tráfico en Vivo</h2>
        <div class="live-table-container">
            <table id="live-table" class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Hora</th><th>Número</th><th>Operador</th><th>Cliente</th><th>Ruta</th><th>Vendor</th><th>Status</th><th>Delay</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
    // 🔴 RECUERDA: Si te sale el error rojo de formato, debes actualizar este link creando una NUEVA IMPLEMENTACIÓN
    const API_URL = "https://script.google.com/macros/s/AKfycbxAs45hYUlPGmCyY4FijgoEa6ZfogMh3WOqQHUvc3FOUt_mhNtLaywoAZdibGVq7gob/exec"; 
    
    let globalData = {};      // Costos (Proveedores)
    let globalSalesData = {}; // Ventas (Clientes)
    let allProviders = new Set(); 
    let banderasISO = {}; 
    let trafficVolumes = {}; 
    let paisActual = "";
    let vistaDetallada = false;

    $(document).ready(function() {
        // 🎯 Ya no hay API de divisas, solo cargamos la data interna pura
        Promise.all([
            fetch('https://restcountries.com/v3.1/all?fields=name,cca2').then(r => r.json()),
            fetch(API_URL).then(r => r.json()).catch(() => null),
            fetch(`datos/live_traffic.xlsx?t=${new Date().getTime()}`).then(r => r.arrayBuffer()).catch(() => null)
        ])
        .then(([paisesMundo, dualData, bufferLive]) => {
            
            // 🛡️ ESCUDO ANTI-ERRORES: Verifica si Google mandó bien la información
            if (!dualData || !dualData.costos || !dualData.ventas) {
                document.getElementById('loading').innerHTML = `
                    <div class="alert alert-danger fw-bold shadow mx-auto" style="max-width: 600px;">
                        🚨 ERROR DE FORMATO EN GOOGLE SHEETS<br><br>
                        Tu Google Apps Script no está enviando las variables 'costos' y 'ventas'.<br>
                        Debes ir a Apps Script > Implementar > <b>NUEVA implementación</b> y actualizar el API_URL en el código.
                    </div>`;
                return; // Detiene la ejecución para no generar el error de "forEach"
            }

            paisesMundo.forEach(p => { banderasISO[p.name.common.toLowerCase()] = p.cca2.toLowerCase(); });
            banderasISO["usa"] = "us"; banderasISO["uk"] = "gb";

            if (bufferLive) {
                const wb = XLSX.read(bufferLive, { type: 'array' });
                const liveData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                liveData.forEach(row => {
                    if (row.CountryRealName) trafficVolumes[row.CountryRealName] = (trafficVolumes[row.CountryRealName] || 0) + 1;
                });
            }

            document.getElementById('loading').style.display = 'none';
            
            // Mapeo de datos (Costos)
            dualData.costos.forEach(row => {
                const p = row.País || "Desconocido";
                if (!globalData[p]) globalData[p] = { nombre: p, proveedores: new Set(), rutas: [] };
                globalData[p].proveedores.add(row.Proveedor);
                globalData[p].rutas.push(row);
                allProviders.add(row.Proveedor);
            });
            // Mapeo de datos (Ventas)
            dualData.ventas.forEach(row => {
                const p = row.CountryRealName || "Desconocido";
                if (!globalSalesData[p]) globalSalesData[p] = { rutas: [] };
                globalSalesData[p].rutas.push(row);
            });

            renderizarTarjetas();
            llenarFiltroProveedores();
        });

        $('#searchCountry').on('keyup', filtrarTarjetas);
        $('#filterProvider').on('change', filtrarTarjetas);
    });

    function renderizarTarjetas() {
        const container = $('#cardsContainer');
        container.empty();
        const paises = Object.keys(globalData).sort((a, b) => (trafficVolumes[b] || 0) - (trafficVolumes[a] || 0));

        paises.forEach(nombre => {
            const info = globalData[nombre];
            const codigoIso = banderasISO[nombre.toLowerCase().trim()];
            const flag = codigoIso ? `<img src="https://flagcdn.com/w40/${codigoIso}.png" width="40" class="mb-3 rounded shadow-sm">` : '🌐';
            const live = trafficVolumes[nombre] ? `<div class="mb-2 text-danger fw-bold" style="font-size: 11px;">🔥 ${trafficVolumes[nombre]} SMS</div>` : '';

            container.append(`
                <div class="col-xl-3 col-lg-4 col-md-6 mb-4 card-item" data-pais="${nombre.toLowerCase()}" data-proveedores="${Array.from(info.proveedores).join(',').toLowerCase()}">
                    <div class="card country-card h-100 shadow-sm bg-white">
                        <div class="card-body text-center">
                            ${flag}
                            <h5 class="card-title mb-1">${nombre}</h5>
                            ${live}
                            <div class="badge bg-light text-dark border mb-3">${info.proveedores.size} Proveedores</div>
                            
                            <div class="d-grid gap-2">
                                <button onclick="abrirProv('${nombre}')" class="btn btn-action btn-prov">📦 Costos Prov.</button>
                                <button onclick="abrirVentas('${nombre}')" class="btn btn-action btn-sale">💰 Precios Venta</button>
                                <button onclick="showLiveTraffic('${nombre}')" class="btn btn-action btn-live">📡 Tráfico Live</button>
                            </div>
                        </div>
                    </div>
                </div>
            `);
        });
    }

    // --- LÓGICA MODAL PROVEEDORES (Costos puros) ---
    function abrirProv(nombre) {
        paisActual = nombre;
        vistaDetallada = false;
        $('#toggleOpBtn').text('Ver Detalle Operadores');
        renderizarTablaProv();
        new bootstrap.Modal(document.getElementById('provModal')).show();
    }

    function toggleOperadores() {
        vistaDetallada = !vistaDetallada;
        $('#toggleOpBtn').text(vistaDetallada ? 'Ocultar Operadores' : 'Ver Detalle Operadores');
        renderizarTablaProv();
    }

    function renderizarTablaProv() {
        const rutas = globalData[paisActual]?.rutas || [];
        const thead = $('#modalProvHead');
        const tbody = $('#modalProvBody');
        thead.empty(); tbody.empty();

        if(vistaDetallada) {
            thead.html('<tr><th>Proveedor</th><th>Ruta</th><th>Operador</th><th class="text-center">Tarifa</th><th class="text-center">Moneda</th></tr>');
            rutas.forEach(r => {
                const tarifa = parseFloat(r.Tarifa) || 0;
                tbody.append(`<tr>
                    <td class="fw-bold text-primary">${r.Proveedor}</td>
                    <td><span class="badge bg-secondary">${r.Ruta}</span></td>
                    <td><small>${r.Operador || 'Todos'}</small></td>
                    <td class="text-center fw-bold">${tarifa.toFixed(4)}</td>
                    <td class="text-center"><span class="badge ${r.Moneda === 'EUR' ? 'bg-info' : 'bg-success'}">${r.Moneda || 'USD'}</span></td>
                </tr>`);
            });
        } else {
            thead.html('<tr><th>Proveedor</th><th>Ruta</th><th class="text-center">Tarifa Min</th><th class="text-center">Moneda</th></tr>');
            // Agrupar por Proveedor + Ruta para mostrar solo la tarifa más baja
            let agrupado = {};
            rutas.forEach(r => {
                const key = `${r.Proveedor}_${r.Ruta}`;
                const tarifa = parseFloat(r.Tarifa) || 0;
                if(!agrupado[key] || tarifa < parseFloat(agrupado[key].Tarifa)) agrupado[key] = r;
            });
            Object.values(agrupado).forEach(r => {
                const tarifa = parseFloat(r.Tarifa) || 0;
                tbody.append(`<tr>
                    <td class="fw-bold text-primary">${r.Proveedor}</td>
                    <td><span class="badge bg-secondary">${r.Ruta}</span></td>
                    <td class="text-center fw-bold">${tarifa.toFixed(4)}</td>
                    <td class="text-center"><span class="badge ${r.Moneda === 'EUR' ? 'bg-info' : 'bg-success'}">${r.Moneda || 'USD'}</span></td>
                </tr>`);
            });
        }
        $('#modalProvName').text(`Costos Proveedores: ${paisActual}`);
    }

    // --- LÓGICA MODAL VENTAS (Ventas puras) ---
    function abrirVentas(nombre) {
        const rutas = globalSalesData[nombre]?.rutas || [];
        const tbody = $('#modalSaleBody');
        tbody.empty();
        
        if(rutas.length === 0) {
            tbody.append('<tr><td colspan="3" class="text-center p-4">No hay rutas de venta cargadas para este país.</td></tr>');
        } else {
            // Ordenar por Cliente
            rutas.sort((a,b) => (a.Cliente || '').localeCompare(b.Cliente || '')).forEach(r => {
                const precioVenta = parseFloat(r.Rate || r.Tarifa || 0);
                tbody.append(`<tr>
                    <td>
                        <div class="fw-bold text-indigo">${r.Cliente || 'Genérico'}</div>
                        <div class="text-muted" style="font-size: 11px;">${r.Ruta}</div>
                    </td>
                    <td class="align-middle"><small>${r.OperatorName || 'Todos'}</small></td>
                    <td class="text-center align-middle fw-bold text-primary">$${precioVenta.toFixed(4)}</td>
                </tr>`);
            });
        }
        $('#modalSaleName').text(`Precios de Venta: ${nombre}`);
        new bootstrap.Modal(document.getElementById('saleModal')).show();
    }

    function llenarFiltroProveedores() {
        const select = $('#filterProvider');
        Array.from(allProviders).sort().forEach(p => select.append(`<option value="${p.toLowerCase()}">${p}</option>`));
    }

    function filtrarTarjetas() {
        const txt = $('#searchCountry').val().toLowerCase();
        const prov = $('#filterProvider').val();
        $('.card-item').each(function() {
            const mTxt = $(this).data('pais').includes(txt);
            const mPrv = (prov === "ALL") || $(this).data('proveedores').includes(prov);
            $(this).toggle(mTxt && mPrv);
        });
    }

    // Live Traffic logic
    function closeLive() { document.getElementById('liveModal').style.display = 'none'; }
</script>
<script src="js/live_logic.js"></script>
</body>
</html>
