<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teldash - Gestión de Rutas Dual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background:
                linear-gradient(140deg, #f8fafc 0%, #eef4ff 48%, #e8f7f3 100%);
            color: #1c1e21;
            min-height: 100vh;
        }
        .header-bg {
            position: relative;
            background:
                linear-gradient(135deg, rgba(30, 60, 114, 0.94), rgba(42, 82, 152, 0.88));
            color: white;
            padding: 42px 0 30px;
            margin-bottom: 30px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .btn-back-dashboard {
            position: absolute;
            top: 18px;
            right: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #eff6ff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.26);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.20);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-back-dashboard:hover { color: white; background: rgba(255, 255, 255, 0.22); }

        .country-card {
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid rgba(148, 163, 184, 0.20) !important;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.74) !important;
            box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255,255,255,0.70) !important;
            backdrop-filter: blur(16px) saturate(135%);
            -webkit-backdrop-filter: blur(16px) saturate(135%);
        }
        .country-card:hover { transform: translateY(-5px); box-shadow: 0 18px 42px rgba(30, 64, 175, 0.14) !important; border-color: rgba(59, 130, 246, 0.26) !important; }
        .card-title { font-weight: 800; font-size: 1.2rem; color: #333; }
        .search-box {
            border-radius: 20px;
            padding: 10px 20px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: rgba(255, 255, 255, 0.76);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255,255,255,0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .btn-action { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 8px; border-radius: 8px; transition: 0.2s; }
        .btn-prov { color: #4b5563; border: 1px solid #d1d5db; background: #f9fafb; }
        .btn-prov:hover { background: #f3f4f6; color: #111827; }
        .btn-sale { color: #3730a3; border: 1px solid #c7d2fe; background: #eef2ff; }
        .btn-sale:hover { background: #e0e7ff; color: #312e81; }
        .btn-live { color: #991b1b; border: 1px solid #fecaca; background: #fef2f2; }

        .modal-content {
            border: 1px solid rgba(148, 163, 184, 0.26);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255,255,255,0.90);
            box-shadow: 0 20px 55px rgba(15, 23, 42, 0.22);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .modal-header-prov { background-color: rgba(243, 244, 246, 0.86); border-bottom: 2px solid rgba(229, 231, 235, 0.75); }
        .modal-header-sale { background-color: rgba(238, 242, 255, 0.88); border-bottom: 2px solid rgba(199, 210, 254, 0.75); color: #312e81; }
        .table-details th { font-size: 0.75rem; text-transform: uppercase; color: #6b7280; background: #f9fafb; }

        .live-modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .live-modal-content {
            background: rgba(30, 41, 59, 0.82);
            margin: 3% auto;
            padding: 25px;
            width: 95%;
            max-width: 1200px;
            border-radius: 15px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            position: relative;
            color: #f8fafc;
            box-shadow: 0 24px 70px rgba(2, 8, 23, 0.45), inset 0 1px 0 rgba(255,255,255,0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .close-live { position: absolute; top: 15px; right: 20px; color: #ef4444; font-size: 30px; cursor: pointer; }
        .live-table-container { margin-top: 20px; max-height: 500px; overflow-y: auto; }
        .live-table-container table { width: 100%; color: #f8fafc; font-size: 13px; }
        @media (max-width: 640px) {
            .btn-back-dashboard {
                position: static;
                margin: 0 auto 18px;
                width: fit-content;
            }
            .header-bg { padding-top: 24px; }
        }
    </style>
</head>
<body>

<div class="header-bg text-center">
    <a href="index.html" class="btn-back-dashboard">Volver al dashboard</a>
    <div class="container">
        <h1 class="fw-bold">🌍 Teldash: Panel de Gestión</h1>
        <p class="lead opacity-75">Control de Costos y Precios de Venta</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row mb-4 justify-content-center">
        <div class="col-md-5 mb-2">
            <input type="text" id="searchCountry" class="form-control search-box" placeholder="🔍 Buscar País (Ej. Chile)...">
        </div>
        <div class="col-md-4 mb-2">
            <select id="filterProvider" class="form-select search-box">
                <option value="ALL">🏢 Todos los Proveedores</option>
            </select>
        </div>
    </div>

    <div id="loading" class="text-center my-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-muted fw-bold">Sincronizando divisas y datos maestros...</p>
    </div>

    <div class="row" id="cardsContainer"></div>
</div>

<!-- ========================================== -->
<!-- MODAL 1: COSTOS PROVEEDORES (COMPRAS) -->
<!-- ========================================== -->
<div class="modal fade" id="provModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header modal-header-prov d-flex justify-content-between align-items-center">
                <h4 class="modal-title fw-bold mb-0" id="modalProvName">Costos Proveedores</h4>
                <div>
                    <button id="toggleOpBtn" class="btn btn-sm btn-outline-secondary me-3" onclick="toggleOperadores()">Ver Detalle Operadores</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-details mb-0">
                        <thead id="modalProvHead"></thead>
                        <tbody id="modalProvBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL 2: PRECIOS DE VENTA (CLIENTES) -->
<!-- ========================================== -->
<div class="modal fade" id="saleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header modal-header-sale d-flex justify-content-between align-items-center">
                <h4 class="modal-title fw-bold mb-0" id="modalSaleName">Rutas de Venta</h4>
                <div>
                    <button id="toggleOpBtnVentas" class="btn btn-sm btn-outline-primary me-3" onclick="toggleOperadoresVentas()">Ver Detalle Operadores</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            </div>
            <div class="modal-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-details mb-0">
                        <thead id="modalSaleHead"></thead>
                        <tbody id="modalSaleBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL 3: TRÁFICO LIVE -->
<!-- ========================================== -->
<div id="liveModal" class="live-modal">
    <div class="live-modal-content">
        <span class="close-live" onclick="closeLive()">&times;</span>
        <h2 id="live-title" style="color: #818cf8; font-weight: 800;">📡 Tráfico en Vivo</h2>
        <div class="live-table-container">
            <table id="live-table" class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th>Hora</th><th>Número</th><th>Operador</th><th>Cliente</th><th>Ruta</th><th>Vendor</th><th>Status</th><th>Delay</th><th>Mensaje</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/config.js"></script>

<script>
    const API_URL = window.TELVOICE_CONFIG?.tariffApiUrl ||
        "https://script.google.com/macros/s/AKfycbxAs45hYUlPGmCyY4FijgoEa6ZfogMh3WOqQHUvc3FOUt_mhNtLaywoAZdibGVq7gob/exec";

    let globalData = {};
    let globalSalesData = {};
    let allProviders = new Set();
    let banderasISO = {};
    let trafficVolumes = {};

    let paisActual = "";
    let vistaDetallada = false;

    let paisActualVentas = "";
    let vistaDetalladaVentas = false;

    let tasaEUR_USD = 1.08;
    let tasaUSD_EUR = 1 / 1.08;

    const COUNTRY_ISO_ALIASES = {
        "argentina": "ar", "bolivia": "bo", "brazil": "br", "brasil": "br", "chile": "cl",
        "colombia": "co", "costa rica": "cr", "dominican republic": "do", "republica dominicana": "do",
        "ecuador": "ec", "el salvador": "sv", "guatemala": "gt", "honduras": "hn", "mexico": "mx",
        "nicaragua": "ni", "panama": "pa", "paraguay": "py", "peru": "pe", "puerto rico": "pr",
        "uruguay": "uy", "venezuela": "ve", "usa": "us", "united states": "us",
        "united states of america": "us", "estados unidos": "us", "uk": "gb", "united kingdom": "gb",
        "great britain": "gb", "england": "gb", "spain": "es", "espana": "es", "france": "fr",
        "francia": "fr", "germany": "de", "alemania": "de", "italy": "it", "italia": "it",
        "portugal": "pt", "netherlands": "nl", "holanda": "nl", "turkey": "tr", "turkiye": "tr",
        "russia": "ru", "south korea": "kr", "korea republic": "kr", "republic of korea": "kr",
        "north korea": "kp", "vietnam": "vn", "viet nam": "vn", "iran": "ir", "syria": "sy",
        "uae": "ae", "united arab emirates": "ae", "emiratos arabes unidos": "ae",
        "saudi arabia": "sa", "arabia saudita": "sa", "ivory coast": "ci", "cote d ivoire": "ci", "cote divoire": "ci",
        "tanzania": "tz", "moldova": "md", "czech republic": "cz", "czechia": "cz",
        "palestine": "ps", "hong kong": "hk", "macau": "mo", "macao": "mo", "taiwan": "tw",
        "laos": "la", "kosovo": "xk"
    };

    function normalizeCountryKey(value) {
        return String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/['’`]/g, '')
            .replace(/&/g, ' and ')
            .replace(/[^a-zA-Z0-9]+/g, ' ')
            .trim()
            .toLowerCase();
    }

    function addCountryIsoAlias(name, iso) {
        const key = normalizeCountryKey(name);
        if (key && iso) banderasISO[key] = String(iso).toLowerCase();
    }

    function seedCountryAliases() {
        Object.entries(COUNTRY_ISO_ALIASES).forEach(([name, iso]) => addCountryIsoAlias(name, iso));
    }

    function getCountryIso(nombre) {
        return banderasISO[normalizeCountryKey(nombre)] || '';
    }

    function pickField(row, fields, fallback = '') {
        for (const field of fields) {
            const value = row?.[field];
            if (value !== undefined && value !== null && String(value).trim() !== '') {
                return String(value).trim();
            }
        }
        return fallback;
    }

    function normalizeRate(value) {
        const rate = parseFloat(String(value ?? 0).replace(',', '.').trim());
        return Number.isFinite(rate) ? rate : 0;
    }

    function normalizeDualData(payload) {
        if (!payload) return { costos: [], ventas: [] };

        if (Array.isArray(payload)) {
            return { costos: payload, ventas: [] };
        }

        return {
            costos: Array.isArray(payload.costos) ? payload.costos : [],
            ventas: Array.isArray(payload.ventas) ? payload.ventas : []
        };
    }

    function mapCostRow(row) {
        return {
            pais: pickField(row, ['País', 'Pais', 'Country', 'pais', 'country', 'CountryRealName'], 'Desconocido'),
            proveedor: pickField(row, ['Proveedor', 'proveedor', 'Cliente(o Proveedor)', 'Vendor', 'vendor'], 'Generico'),
            ruta: pickField(row, ['Ruta', 'ruta'], '--'),
            mcc: pickField(row, ['MCC', 'mcc'], '0'),
            mnc: pickField(row, ['MNC', 'mnc'], '0'),
            operador: pickField(row, ['Operador', 'operador', 'Operator', 'OperatorName'], 'Todos'),
            tarifa: normalizeRate(pickField(row, ['Tarifa', 'tarifa', 'Rate', 'rate'], 0)),
            moneda: pickField(row, ['Moneda', 'moneda', 'Currency', 'currency'], 'USD')
        };
    }

    function mapSaleRow(row) {
        return {
            pais: pickField(row, ['País', 'Pais', 'Country', 'pais', 'country', 'CountryRealName'], 'Desconocido'),
            cliente: pickField(row, ['Cliente', 'cliente', 'CompanyName', 'Proveedor', 'proveedor', 'Cliente(o Proveedor)'], 'Generico'),
            ruta: pickField(row, ['Ruta', 'ruta'], '--'),
            mcc: pickField(row, ['MCC', 'mcc'], '0'),
            mnc: pickField(row, ['MNC', 'mnc'], '0'),
            operador: pickField(row, ['Operador', 'operador', 'Operator', 'OperatorName'], 'Todos'),
            tarifa: normalizeRate(pickField(row, ['Tarifa', 'tarifa', 'Rate', 'rate'], 0)),
            moneda: pickField(row, ['Moneda', 'moneda', 'Currency', 'currency'], 'USD')
        };
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[char]));
    }

    function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
    }

$(document).ready(function() {
        Promise.all([
            // Protegemos la API de banderas
            fetch('https://restcountries.com/v3.1/all?fields=name,cca2,translations,altSpellings').then(r => r.ok ? r.json() : []).catch(() => []),

            // API Principal de Google
            fetch(API_URL).then(r => r.json()).catch(e => null),

            // Protegemos el archivo Live Traffic por si no existe en GitHub Pages aún (Evita error de lectura)
            fetch(`datos/live_traffic.xlsx?t=${new Date().getTime()}`).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null),

            // API de divisas
            fetch('https://open.er-api.com/v6/latest/EUR').then(r => r.ok ? r.json() : null).catch(() => null)
        ])
        .then(([paisesMundo, dualData, bufferLive, fxData]) => {
            try {
                // 1. Tasa de cambio
                if(fxData && fxData.rates && fxData.rates.USD) {
                    tasaEUR_USD = fxData.rates.USD;
                    tasaUSD_EUR = 1 / tasaEUR_USD;
                }

                const normalizedData = normalizeDualData(dualData);

                // 2. Verificación de Google Sheets
                if (!normalizedData.costos.length && !normalizedData.ventas.length) {
                    document.getElementById('loading').innerHTML = `<div class="alert alert-danger mx-auto text-center shadow">🚨 ERROR DE FORMATO O CONEXIÓN CON GOOGLE SHEETS</div>`;
                    return;
                }

                // 3. Mapeo de banderas
                if (Array.isArray(paisesMundo)) {
                    paisesMundo.forEach(p => {
                        if (!p.cca2) return;
                        addCountryIsoAlias(p.name?.common, p.cca2);
                        addCountryIsoAlias(p.name?.official, p.cca2);
                        addCountryIsoAlias(p.translations?.spa?.common, p.cca2);
                        addCountryIsoAlias(p.translations?.spa?.official, p.cca2);
                        (p.altSpellings || []).forEach(alias => addCountryIsoAlias(alias, p.cca2));
                    });
                }
                seedCountryAliases();

                // 4. Mapeo Live Traffic (Protegido contra Excel corruptos o 404)
                if (bufferLive) {
                    try {
                        const wb = XLSX.read(bufferLive, { type: 'array' });
                        const liveData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        liveData.forEach(row => {
                            if (row.CountryRealName) trafficVolumes[row.CountryRealName] = (trafficVolumes[row.CountryRealName] || 0) + 1;
                        });
                    } catch (errLive) {
                        console.warn("⚠️ No se pudo procesar el tráfico en vivo (puede estar vacío o corrupto).", errLive);
                    }
                }

                // 5. 🎯 MAPEO EXACTO PARA COSTOS (PROVEEDORES)
                normalizedData.costos.forEach(row => {
                    const item = mapCostRow(row);
                    const p = item.pais;
                    const prov = item.proveedor;

                    if (!globalData[p]) globalData[p] = { nombre: p, proveedores: new Set(), rutas: [] };
                    globalData[p].proveedores.add(prov);

                    globalData[p].rutas.push({
                        Proveedor: prov,
                        Ruta: item.ruta,
                        MCC: item.mcc,
                        MNC: item.mnc,
                        Operador: item.operador,
                        Tarifa: item.tarifa,
                        Moneda: item.moneda
                    });
                    allProviders.add(prov);
                });

                // 6. 🎯 MAPEO EXACTO PARA VENTAS (CLIENTES)
                normalizedData.ventas.forEach(row => {
                    const item = mapSaleRow(row);
                    const p = item.pais;
                    const cli = item.cliente;

                    if (!globalSalesData[p]) globalSalesData[p] = { rutas: [] };

                    globalSalesData[p].rutas.push({
                        Cliente: cli,
                        Ruta: item.ruta,
                        MCC: item.mcc,
                        MNC: item.mnc,
                        Operador: item.operador,
                        Tarifa: item.tarifa,
                        Moneda: item.moneda
                    });
                });

                // 7. Renderizar y ocultar carga
                document.getElementById('loading').style.display = 'none';
                renderizarTarjetas();
                llenarFiltroProveedores();

            } catch (errorFantasma) {
                // Si algo se rompe dentro, lo mostramos en pantalla gigante
                console.error("Error interno:", errorFantasma);
                document.getElementById('loading').innerHTML = `<div class="alert alert-danger mx-auto text-center shadow">🚨 ERROR INTERNO DE CÓDIGO: <br> ${errorFantasma.message}</div>`;
            }
        })
        .catch(errGrave => {
            // Si el internet o las promesas fallan brutalmente
            console.error("Fallo general:", errGrave);
            document.getElementById('loading').innerHTML = `<div class="alert alert-danger mx-auto text-center shadow">🚨 ERROR DE RED: No se pudieron descargar los datos.</div>`;
        });

        // Eventos de búsqueda
        $('#searchCountry').on('keyup', filtrarTarjetas);
        $('#filterProvider').on('change', filtrarTarjetas);
        $(document).on('click', '.js-open-prov', function() { abrirProv($(this).attr('data-country')); });
        $(document).on('click', '.js-open-sales', function() { abrirVentas($(this).attr('data-country')); });
        $(document).on('click', '.js-open-live', function() { showLiveTraffic($(this).attr('data-country')); });
    });

    function formatDualCurrency(amount, currency) {
        amount = parseFloat(amount) || 0;
        currency = (currency || 'USD').toString().trim().toUpperCase();

        if (currency === 'EUR' || currency === 'EURO') {
            let inUSD = amount * tasaEUR_USD;
            return `<span class="fw-bold fs-6">€${amount.toFixed(4)}</span> <br><small class="text-muted" style="font-size: 0.7rem;">($${inUSD.toFixed(4)})</small>`;
        } else {
            let inEUR = amount * tasaUSD_EUR;
            return `<span class="fw-bold fs-6 text-primary">$${amount.toFixed(4)}</span> <br><small class="text-muted" style="font-size: 0.7rem;">(€${inEUR.toFixed(4)})</small>`;
        }
    }

    // --- LÓGICA MODAL PROVEEDORES ---
    function abrirProv(nombre) {
        paisActual = nombre;
        vistaDetallada = false;
        $('#toggleOpBtn').text('Ver Detalle Operadores');
        renderizarTablaProv();
        new bootstrap.Modal(document.getElementById('provModal')).show();
    }

    function toggleOperadores() {
        vistaDetallada = !vistaDetallada;
        $('#toggleOpBtn').text(vistaDetallada ? 'Ocultar Operadores' : 'Ver Detalle Operadores');
        renderizarTablaProv();
    }

    function renderizarTablaProv() {
        const rutas = globalData[paisActual]?.rutas || [];
        const thead = $('#modalProvHead');
        const tbody = $('#modalProvBody');
        thead.empty(); tbody.empty();

        if(vistaDetallada) {
            thead.html('<tr><th>Proveedor</th><th>Ruta</th><th>Operador (MCC/MNC)</th><th class="text-center">Tarifa <br><small>(Orig / Conv)</small></th></tr>');
            rutas.sort((a,b) => (a.Proveedor || '').localeCompare(b.Proveedor || '')).forEach(r => {
                const mcc_mnc = `${r.MCC || '0'}/${r.MNC || '0'}`;
                tbody.append(`<tr>
                    <td class="fw-bold text-primary align-middle">${escapeHtml(r.Proveedor || '--')}</td>
                    <td class="align-middle"><span class="badge bg-secondary">${escapeHtml(r.Ruta || '--')}</span></td>
                    <td class="align-middle"><small>${escapeHtml(r.Operador || 'Todos')}</small> <br><span class="text-muted" style="font-size: 0.7rem;">[${escapeHtml(mcc_mnc)}]</span></td>
                    <td class="text-center align-middle">${formatDualCurrency(r.Tarifa, r.Moneda)}</td>
                </tr>`);
            });
        } else {
            thead.html('<tr><th>Proveedor</th><th>Ruta</th><th class="text-center">Tarifa Mínima <br><small>(Orig / Conv)</small></th></tr>');
            let agrupado = {};
            rutas.forEach(r => {
                const key = `${r.Proveedor}_${r.Ruta}`;
                const tarifaActual = parseFloat(r.Tarifa) || 0;
                const tarifaGuardada = agrupado[key] ? (parseFloat(agrupado[key].Tarifa) || Infinity) : Infinity;
                if(!agrupado[key] || tarifaActual < tarifaGuardada) agrupado[key] = r;
            });
            Object.values(agrupado).sort((a,b) => (a.Proveedor || '').localeCompare(b.Proveedor || '')).forEach(r => {
                tbody.append(`<tr>
                    <td class="fw-bold text-primary align-middle">${escapeHtml(r.Proveedor || '--')}</td>
                    <td class="align-middle"><span class="badge bg-secondary">${escapeHtml(r.Ruta || '--')}</span></td>
                    <td class="text-center align-middle">${formatDualCurrency(r.Tarifa, r.Moneda)}</td>
                </tr>`);
            });
        }
        $('#modalProvName').text(`Costos Proveedores: ${paisActual}`);
    }

    // --- LÓGICA MODAL VENTAS ---
    function abrirVentas(nombre) {
        paisActualVentas = nombre;
        vistaDetalladaVentas = false;
        $('#toggleOpBtnVentas').text('Ver Detalle Operadores');
        renderizarTablaVentas();
        new bootstrap.Modal(document.getElementById('saleModal')).show();
    }

    function toggleOperadoresVentas() {
        vistaDetalladaVentas = !vistaDetalladaVentas;
        $('#toggleOpBtnVentas').text(vistaDetalladaVentas ? 'Ocultar Operadores' : 'Ver Detalle Operadores');
        renderizarTablaVentas();
    }

    function renderizarTablaVentas() {
        const rutas = globalSalesData[paisActualVentas]?.rutas || [];
        const thead = $('#modalSaleHead');
        const tbody = $('#modalSaleBody');
        thead.empty(); tbody.empty();

        if(rutas.length === 0) {
            tbody.append('<tr><td colspan="4" class="text-center p-4">No hay rutas de venta cargadas para este país.</td></tr>');
            $('#modalSaleName').text(`Precios de Venta: ${paisActualVentas}`);
            return;
        }

        if(vistaDetalladaVentas) {
            thead.html('<tr><th>Cliente</th><th>Ruta</th><th>Operador (MCC/MNC)</th><th class="text-center">Precio Venta <br><small>(Orig / Conv)</small></th></tr>');
            rutas.sort((a,b) => (a.Cliente || '').localeCompare(b.Cliente || '')).forEach(r => {
                const mcc_mnc = `${r.MCC || '0'}/${r.MNC || '0'}`;
                tbody.append(`<tr>
                    <td class="fw-bold text-indigo align-middle">${escapeHtml(r.Cliente || '--')}</td>
                    <td class="align-middle"><span class="badge bg-light text-dark border">${escapeHtml(r.Ruta || '--')}</span></td>
                    <td class="align-middle"><small>${escapeHtml(r.Operador || 'Todos')}</small> <br><span class="text-muted" style="font-size: 0.7rem;">[${escapeHtml(mcc_mnc)}]</span></td>
                    <td class="text-center align-middle">${formatDualCurrency(r.Tarifa, r.Moneda)}</td>
                </tr>`);
            });
        } else {
            thead.html('<tr><th>Cliente</th><th>Ruta</th><th class="text-center">Precio Mínimo <br><small>(Orig / Conv)</small></th></tr>');
            let agrupado = {};
            rutas.forEach(r => {
                const key = `${r.Cliente}_${r.Ruta}`;
                const tarifaActual = parseFloat(r.Tarifa) || 0;
                const tarifaGuardada = agrupado[key] ? (parseFloat(agrupado[key].Tarifa) || Infinity) : Infinity;
                if(!agrupado[key] || tarifaActual < tarifaGuardada) agrupado[key] = r;
            });
            Object.values(agrupado).sort((a,b) => (a.Cliente || '').localeCompare(b.Cliente || '')).forEach(r => {
                tbody.append(`<tr>
                    <td class="fw-bold text-indigo align-middle">${escapeHtml(r.Cliente || '--')}</td>
                    <td class="align-middle"><span class="badge bg-light text-dark border">${escapeHtml(r.Ruta || '--')}</span></td>
                    <td class="text-center align-middle">${formatDualCurrency(r.Tarifa, r.Moneda)}</td>
                </tr>`);
            });
        }
        $('#modalSaleName').text(`Precios de Venta: ${paisActualVentas}`);
    }

    // --- TARJETAS Y FILTROS ---
    function renderizarTarjetas() {
        const container = $('#cardsContainer');
        container.empty();
        const paises = [...new Set([...Object.keys(globalData), ...Object.keys(globalSalesData)])]
            .sort((a, b) => (trafficVolumes[b] || 0) - (trafficVolumes[a] || 0) || a.localeCompare(b));

        paises.forEach(nombre => {
            const info = globalData[nombre] || { nombre, proveedores: new Set(), rutas: [] };
            const ventas = globalSalesData[nombre]?.rutas?.length || 0;
            const codigoIso = getCountryIso(nombre);
            const flag = codigoIso
                ? `<img src="https://flagcdn.com/w40/${codigoIso}.png" width="40" height="30" loading="lazy" alt="Bandera ${escapeAttr(nombre)}" class="mb-3 rounded shadow-sm" onerror="this.replaceWith(document.createTextNode('🌐'))">`
                : '🌐';
            const live = trafficVolumes[nombre] ? `<div class="mb-2 text-danger fw-bold" style="font-size: 11px;">🔥 ${trafficVolumes[nombre]} SMS</div>` : '';
            const proveedoresTexto = `${info.proveedores.size} Proveedores`;
            const ventasTexto = ventas ? `<div class="badge bg-light text-dark border mb-3 ms-1">${ventas} Ventas</div>` : '';

            container.append(`
                <div class="col-xl-3 col-lg-4 col-md-6 mb-4 card-item" data-pais="${escapeAttr(nombre.toLowerCase())}" data-proveedores="${escapeAttr(Array.from(info.proveedores).join(',').toLowerCase())}">
                    <div class="card country-card h-100 shadow-sm bg-white">
                        <div class="card-body text-center">
                            ${flag}
                            <h5 class="card-title mb-1">${escapeHtml(nombre)}</h5>
                            ${live}
                            <div class="badge bg-light text-dark border mb-3">${escapeHtml(proveedoresTexto)}</div>${ventasTexto}
                            <div class="d-grid gap-2">
                                <button type="button" data-country="${escapeAttr(nombre)}" class="btn btn-action btn-prov js-open-prov">📦 Costos Prov.</button>
                                <button type="button" data-country="${escapeAttr(nombre)}" class="btn btn-action btn-sale js-open-sales">💰 Precios Venta</button>
                                <button type="button" data-country="${escapeAttr(nombre)}" class="btn btn-action btn-live js-open-live">📡 Tráfico Live</button>
                            </div>
                        </div>
                    </div>
                </div>
            `);
        });
    }

    function llenarFiltroProveedores() {
        const select = $('#filterProvider');
        Array.from(allProviders).sort().forEach(p => {
            select.append(`<option value="${escapeAttr(p.toLowerCase())}">${escapeHtml(p)}</option>`);
        });
    }

    function filtrarTarjetas() {
        const txt = ($('#searchCountry').val() || '').toLowerCase();
        const prov = $('#filterProvider').val();
        $('.card-item').each(function() {
            const pais = String($(this).attr('data-pais') || '');
            const proveedores = String($(this).attr('data-proveedores') || '');
            const mTxt = pais.includes(txt);
            const mPrv = (prov === "ALL") || proveedores.includes(prov);
            $(this).toggle(mTxt && mPrv);
        });
    }

    function closeLive() { document.getElementById('liveModal').style.display = 'none'; }
</script>
<script src="js/live_logic.js"></script>
</body>
</html>
