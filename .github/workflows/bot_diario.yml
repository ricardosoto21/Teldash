name: Bot de Actualizacion Diaria SMS

on:
  schedule:
    # Corre todos los dias y reintenta una ventana reciente para evitar huecos permanentes.
    - cron: '1 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias
        run: pip install pandas openpyxl requests beautifulsoup4 lxml

      - name: Ejecutar script de actualizacion
        run: python update_data.py
        env:
          SMS_USER: ${{ secrets.SMS_USER }}
          SMS_PASS: ${{ secrets.SMS_PASS }}
          BACKFILL_DAYS: 7

      - name: Subir el Excel actualizado de vuelta al repositorio
        run: |
          git config --global user.name 'Bot SMS Analytics'
          git config --global user.email 'bot@tudominio.com'
          git add datos/reporte_actual.xlsx
          git commit -m "Actualizacion automatica: Datos recientes" || echo "Sin cambios nuevos para guardar"
          git pull --rebase origin main
          git push origin main
