name: Rescate de Datos Manual
on:
  workflow_dispatch: # Esto crea el botón "Run workflow" en GitHub

jobs:
  rescue-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install pandas openpyxl requests beautifulsoup4
      - name: Ejecutar script de rescate
        env:
          SMS_USER: ${{ secrets.SMS_USER }}
          SMS_PASS: ${{ secrets.SMS_PASS }}
        run: python recuperar_datos.py
      - name: Guardar en GitHub
        run: |
          git config --global user.name 'Bot de Rescate'
          git config --global user.email 'bot@github.com'
          git add datos/reporte_actual.xlsx
          git commit -m "🚑 Rescate manual de datos faltantes" || echo "Sin cambios"
          git pull --rebase origin main
          git push origin main
