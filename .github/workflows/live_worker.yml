name: Live Traffic Monitor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install pandas openpyxl requests beautifulsoup4
      - name: Run Live Bot
        env:
          SMS_USER: ${{ secrets.SMS_USER }}
          SMS_PASS: ${{ secrets.SMS_PASS }}
        run: python update_live.py
      - name: Commit & Push
        run: |
          git config --global user.name 'Live Monitor Bot'
          git config --global user.email 'bot@github.com'
          git add datos/live_traffic.xlsx
          git commit -m "📡 Update Live Traffic [$(date)]" || echo "No changes"
          git pull --rebase origin main
          git push origin main
